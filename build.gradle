plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

base {
    archivesName = 'arachne-ledger'
}

repositories {
    mavenCentral()
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'com.terraformersmc'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // The optional entrypoint compiles against the API without installing or bundling Mod Menu.
    compileOnly("com.terraformersmc:modmenu:${mod_menu_version}") {
        transitive = false
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    def metadata = [
        version: project.version,
        minecraft_version: minecraft_version,
        fabric_loader_version: fabric_loader_version,
        fabric_api_min_version: fabric_api_version.split('\\+')[0]
    ]
    inputs.properties metadata
    filesMatching('fabric.mod.json') {
        expand metadata
    }
}

// These deterministic main-method suites use the real runtime classpath, without a game server.
// Keep their registration visible here so new modules have one obvious verification entry point.
def regressionSuites = [
    'ProgressionIntegration': 'dev.arachneledger.tracking',
    'Achievement': 'dev.arachneledger.achievement',
    'Diagnostics': 'dev.arachneledger.diagnostics',
    'ProfitBreakdown': 'dev.arachneledger.ledger',
    'SessionRecords': 'dev.arachneledger.ledger',
    'HudPreferences': 'dev.arachneledger.config',
    'HudContent': 'dev.arachneledger.ui',
    'Analytics': 'dev.arachneledger.ledger',
    'Bazaar': 'dev.arachneledger.pricing',
    'BazaarModes': 'dev.arachneledger.pricing',
    'Fight': 'dev.arachneledger.tracking',
    'Graph': 'dev.arachneledger.ui',
    'History': 'dev.arachneledger.tracking',
    'Integration': 'dev.arachneledger.tracking',
    'LocationDetection': 'dev.arachneledger.skyblock',
    'LootDeduplicator': 'dev.arachneledger.tracking',
    'LootLabels': 'dev.arachneledger.skyblock',
    'LootTracking': 'dev.arachneledger.tracking',
    'Persistence': 'dev.arachneledger.config',
    'PetReward': 'dev.arachneledger.tracking',
    'PurseCoins': 'dev.arachneledger.skyblock',
    'RngAlerts': 'dev.arachneledger.ui',
    'Spawn': 'dev.arachneledger.tracking',
    'T2Spawn': 'dev.arachneledger.tracking',
    'Tracker': 'dev.arachneledger.tracking',
    'Valuation': 'dev.arachneledger.tracking'
]
regressionSuites.each { suite, suitePackage ->
    def verification = tasks.register("verify${suite}", JavaExec) {
        group = 'verification'
        description = "Run the ${suite} regression checks."
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "${suitePackage}.${suite}Checks"
    }
    tasks.named('check') {
        dependsOn verification
    }
}

// There are no JUnit tests; the registered suites above are the project's test runner.
tasks.named('test') {
    enabled = false
}

tasks.named('jar') {
    from('LICENSE')
}

apply from: 'gradle/java-format.gradle'
