name: Prepare GitHub release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and verify tag, changelog and packaged files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash ./gradlew --no-daemon --console plain prepareRelease
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/release/*.jar build/release/*-source.zip build/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Arachne Ledger $RELEASE_TAG" --notes-file build/release/notes.md
